// 기존 code: maxWidth = 500, quality = 0.3
// 수정 code: maxWidth = 400, quality = 0.2 (용량 폭증 방지)
const compressImage = (file, maxWidth = 400, quality = 0.2) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
};


    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(`Error reading localStorage key "${key}":`, error);
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {
          console.error(`Error setting localStorage key "${key}":`, error);
        }
      }, [key, storedValue]);

      return [storedValue, setStoredValue];
    }

    function SwipeableCard({ children, onEdit, onDelete, onClickContent }) {
      const [translateX, setTranslateX] = useState(0);
      const startX = useRef(0);
      const currentX = useRef(0);
      const isDragging = useRef(false);

      const handleTouchStart = (e) => {
        startX.current = e.touches ? e.touches[0].clientX : e.clientX;
        currentX.current = startX.current;
        isDragging.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isDragging.current) return;
        currentX.current = e.touches ? e.touches[0].clientX : e.clientX;
        const diff = currentX.current - startX.current;
        if (Math.abs(diff) < 120) {
          setTranslateX(diff);
        }
      };

      const handleTouchEnd = (e) => {
        if (!isDragging.current) return;
        isDragging.current = false;
        const diff = currentX.current - startX.current;

        if (translateX > 70) {
          onDelete && onDelete();
        } else if (translateX < -70) {
          onEdit && onEdit();
        } else if (Math.abs(diff) < 5) {
          const targetTag = e.target.tagName.toLowerCase();
          if (!['button', 'input', 'select', 'label', 'option', 'a'].includes(targetTag) && onClickContent) {
            onClickContent();
          }
        }
        setTranslateX(0);
      };

      return (
        <div 
          className="swipe-container rounded-2xl overflow-hidden select-none my-1"
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
          onMouseDown={handleTouchStart}
          onMouseMove={handleTouchMove}
          onMouseUp={handleTouchEnd}
          onMouseLeave={handleTouchEnd}
        >
          <div className="absolute inset-0 flex justify-between items-center px-4 font-bold text-xs text-white">
            <div className="bg-red-500 h-full w-1/2 flex items-center justify-start pl-4">🗑️ 삭제</div>
            <div className="bg-indigo-600 h-full w-1/2 flex items-center justify-end pr-4">✏️ 수정</div>
          </div>

          <div 
            className="swipe-content bg-white p-3.5 relative z-10 border-b border-slate-100"
            style={{ transform: `translateX(${translateX}px)` }}
          >
            {children}
          </div>
        </div>
      );
    }

          const usdVal = Number(usdLocal) || 1;
          const krwVal = Number(krwUsd) || 0;
          const doubleRate = krwVal / usdVal;
          return Math.round(amt * doubleRate);
        }
        
        return Math.round(amt * (customBaseRate || 0));
      };

      const calcPlannedKrw = (plannedLocal) => {
        if (!plannedLocal) return 0;
        const amt = Number(plannedLocal);
        return Math.round(amt * (customBaseRate || 0));
      };

      const getExpenseGroupSummary = (expenseList) => {
        let totalKrw = 0, totalLocal = 0, hasEstimatedRate = false;
        expenseList.forEach(item => {
          totalKrw += calcKrw(item);
          totalLocal += Number(item.amountLocal || 0);
          if (!item.customKrw) hasEstimatedRate = true;
        });
        return { totalKrw, totalLocal, hasEstimatedRate };
      };

      const getCategoryExpenseStats = () => {
        if (!selectedCountry) return { categoryTotals: [], grandTotal: 0, conicGradient: '', subCategoryTotals: [], paymentTotals: [] };
        
        const currentExpenses = expenses.filter(e => e.countryId === selectedCountry.id && !e.excludeFromStats);
        
        const categoryMap = { '식비': 0, '교통': 0, '쇼핑': 0, '관광': 0, '숙박': 0, '기타': 0 };
        const subCategoryMap = {};
        const paymentMap = { '카드': 0, '페이': 0, '현금': 0 };
        let grandTotal = 0;

        currentExpenses.forEach(exp => {
          const amount = calcKrw(exp);
          const cat = categoryMap[exp.category] !== undefined ? exp.category : '기타';
          categoryMap[cat] += amount;
          grandTotal += amount;

          const sub = exp.subCategory || `${cat}(일반)`;
          subCategoryMap[sub] = (subCategoryMap[sub] || 0) + amount;

          const pay = paymentMap[exp.paymentMethod] !== undefined ? exp.paymentMethod : '카드';
          paymentMap[pay] += amount;
        });

        const colorMap = { '식비': '#ef4444', '교통': '#3b82f6', '쇼핑': '#f59e0b', '관광': '#10b981', '숙박': '#6366f1', '기타': '#8b5cf6' };
        const categoryTotals = Object.keys(categoryMap).map(cat => ({
          name: cat,
          amount: categoryMap[cat],
          color: colorMap[cat],
          percent: grandTotal > 0 ? Math.round((categoryMap[cat] / grandTotal) * 100) : 0
        })).filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);

        const subCategoryTotals = Object.keys(subCategoryMap).map(sub => ({
          name: sub,
          amount: subCategoryMap[sub],
          percent: grandTotal > 0 ? Math.round((subCategoryMap[sub] / grandTotal) * 100) : 0
        })).filter(s => s.amount > 0).sort((a, b) => b.amount - a.amount);

        const paymentColors = { '카드': '#3b82f6', '페이': '#f59e0b', '현금': '#10b981' };
        const paymentIcons = { '카드': '💳', '페이': '🟡', '현금': '💵' };
        const paymentTotals = Object.keys(paymentMap).map(pay => ({
          name: pay,
          icon: paymentIcons[pay],
          color: paymentColors[pay],
          amount: paymentMap[pay],
          percent: grandTotal > 0 ? Math.round((paymentMap[pay] / grandTotal) * 100) : 0
        })).sort((a, b) => b.amount - a.amount);

        let currentAngle = 0;
        const gradientSegments = categoryTotals.map(c => {
          const start = currentAngle;
          const percentage = (c.amount / (grandTotal || 1)) * 100;
          currentAngle += percentage;
          return `${c.color} ${start}% ${currentAngle}%`;
        });

        const conicGradient = grandTotal > 0 ? `conic-gradient(${gradientSegments.join(', ')})` : `conic-gradient(#cbd5e1 0% 100%)`;
        return { categoryTotals, grandTotal, conicGradient, subCategoryTotals, paymentTotals };
      };

const handleMultipleDiaryImageUpload = async (e) => {
  const files = Array.from(e.target.files);
  if (files.length === 0 || !fullEditDiary) return;
  try {
    const compressedImages = await Promise.all(files.map(file => compressImage(file, 400, 0.2)));
    const newBlocks = compressedImages.map((imgUrl, index) => ({ id: Date.now() + index, image: imgUrl, text: '' }));
    setFullEditDiary({ ...fullEditDiary, blocks: [...fullEditDiary.blocks, ...newBlocks] });
  } catch (err) {
    alert("사진 첨부 중 오류가 발생했습니다.");
  }
};

const handleMoveDiaryBlock = (index, dir) => {
  const blocks = [...fullEditDiary.blocks];
  if (
    (dir === -1 && index === 0) ||
    (dir === 1 && index === blocks.length - 1)
  )
    return;
  const temp = blocks[index];
  blocks[index] = blocks[index + dir];
  blocks[index + dir] = temp;
  setFullEditDiary({ ...fullEditDiary, blocks });
};

        const existing = spots.find(s => s.countryId === selectedCountry?.id && s.name === name);
        if (existing) {

        }

      const handleSaveRatingProcess = (forceShift = false) => {
        const targetRank = Number(fullRatingPage.rank || 0);
        const targetCategory = fullRatingPage.category;

        if (targetRank > 0 && !forceShift) {
          const existingRankItem = spots.find(s => s.countryId === selectedCountry.id && s.category === targetCategory && s.rank === targetRank && s.name !== fullRatingPage.spotName);
          if (existingRankItem) {
            setRankShiftPopup({ existingItem: existingRankItem, newRank: targetRank });
            return;
          }
        }

        let updatedSpots = spots.filter(s => !(s.countryId === selectedCountry.id && s.name === fullRatingPage.spotName));
        if (targetRank > 0 && forceShift) {
          updatedSpots = updatedSpots.map(s => (s.countryId === selectedCountry.id && s.category === targetCategory && s.rank >= targetRank && s.rank < 3) ? { ...s, rank: s.rank + 1 } : s);
        }

        updatedSpots.push({
          id: fullRatingPage.id || Date.now(),
          countryId: selectedCountry.id,
          name: fullRatingPage.spotName,
          category: fullRatingPage.category,
          rating: Number(fullRatingPage.rating || 5),
          rank: targetRank,
          review: fullRatingPage.review || '',

          </div>
          <input type="file" accept="image/*" onChange={e => handleCompressedFileUpload(e.target.files[0], (name, base64) => handleUpdateDiaryBlock(block.id, 'image', base64))} className="w-full text-xs p-1.5 border rounded-xl bg-white" />
          {block.image && <img src={block.image} className="w-full h-36 object-cover rounded-xl mt-2" />}
          <textarea placeholder="일기 내용 작성..." value={block.text} onChange={e => handleUpdateDiaryBlock(block.id, 'text', e.target.value)} className="w-full p-3 border rounded-xl text-xs h-24 bg-white" />
        </div>
      ))}
    </div>

    <button onClick={handleAddDiaryBlock} className="w-full py-3 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold border">+ 블록 추가</button>
    <button onClick={() => handleSaveDiarySubmit(false)} className="w-full py-3.5 bg-indigo-600 text-white rounded-xl text-sm font-bold">저장 완료</button>
  </div>
)}

{/* ⚠️ 동일 일차 작성 중복 확인 팝업 */}
{diaryConflictPopup && (
  <div className="fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4">
    <div className="bg-white rounded-3xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
      <h4 className="font-black text-amber-600 text-base border-b pb-2">⚠️ 동일 일차 일기 감지</h4>
      <p className="text-xs text-slate-700 leading-relaxed">
        이미 <b>{fullEditDiary?.day}일차 ({diaryConflictPopup.existingDiary.createdDate})</b> 일기가 작성되어 있습니다.<br/><br/>
        해당 일차에 일기를 추가로 덧붙이시겠습니까?
      </p>
      
      <div className="space-y-2 pt-1">
        <button 
          onClick={() => handleSaveDiarySubmit(true)} 
          className="w-full py-2.5 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow"
        >
          ➕ 기존 {fullEditDiary?.day}일차 일기에 덧붙이기
        </button>
        <button 
          onClick={() => {
            alert("일자를 다시 확인해 주세요!");
            setDiaryConflictPopup(null);
          }} 
          className="w-full py-2.5 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl border border-slate-200"
        >
          🔄 일자 다시 확인하기 (취소)
        </button>
      </div>
    </div>
  </div>
)}

{/* 📷 일기 상세 보기 모달 */}
              {fullDiaryModal && (
                <div className="fixed inset-0 bg-white z-50 flex flex-col p-5 overflow-y-auto space-y-4">
                  <div className="flex justify-between items-center pb-3 border-b">
                    <h3 className="font-black text-lg text-slate-800">{fullDiaryModal.title}</h3>
                    <button onClick={() => setFullDiaryModal(null)} className="text-slate-400 font-bold text-lg">✕ 닫기</button>
                  </div>
                  <div className="space-y-6 flex-1">
                    {fullDiaryModal.blocks.map((block, idx) => (
                      <div key={idx} className="space-y-2">
                        {block.image && <img src={block.image} className="w-full rounded-2xl shadow-md" />}
                        {block.text && <p className="text-sm text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-2xl border">{block.text}</p>}
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2 pt-2 border-t">
                    <button onClick={() => handleDeleteDiary(fullDiaryModal.id)} className="flex-1 py-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-200">🗑️ 삭제</button>
                    <button onClick={() => { setFullEditDiary(fullDiaryModal); setFullDiaryModal(null); }} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow">✏️ 수정</button>
                  </div>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TravelApp />);
</script>
</body>
</html>
