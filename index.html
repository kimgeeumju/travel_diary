<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 여행 기록 (Travel Log & Diary)</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .swipe-container {
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }
    .swipe-content {
      transition: transform 0.2s ease-out;
      will-change: transform;
    }
    .draggable-spot {
      cursor: grab;
    }
    .draggable-spot:active {
      cursor: grabbing;
      opacity: 0.6;
    }
  </style>

  <!-- Firebase SDK 모듈 로드 (Hosting 자동 연동) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let firebaseConfig = {};
    try {
      const response = await fetch('/__/firebase/init.json');
      firebaseConfig = await response.json();
    } catch (e) {
      console.warn("Firebase Hosting init.json을 불러올 수 없어 로컬 모드로 동작합니다.");
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.FirebaseAPI = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, doc, setDoc, onSnapshot };
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(`Error reading localStorage key "${key}":`, error);
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {
          console.error(`Error setting localStorage key "${key}":`, error);
        }
      }, [key, storedValue]);

      return [storedValue, setStoredValue];
    }

    const FLAG_MAP = {
      '일본': '🇯🇵', '도쿄': '🇯🇵', '오사카': '🇯🇵', '후쿠오카': '🇯🇵', '삿포로': '🇯🇵',
      '프랑스': '🇫🇷', '파리': '🇫🇷',
      '미국': '🇺🇸', '뉴욕': '🇺🇸', 'LA': '🇺🇸', '하와이': '🇺🇸',
      '영국': '🇬🇧', '런던': '🇬🇧',
      '이탈리아': '🇮🇹', '로마': '🇮🇹', '베네치아': '🇮🇹',
      '스페인': '🇪🇸', '바르셀로나': '🇪🇸', '마드리드': '🇪🇸',
      '태국': '🇹🇭', '방콕': '🇹🇭', '치앙마이': '🇹🇭',
      '베트남': '🇻🇳', '다낭': '🇻🇳', '하노이': '🇻🇳', '나트랑': '🇻🇳',
      '대만': '🇹🇼', '타이베이': '🇹🇼',
      '중국': '🇨🇳', '상하이': '🇨🇳', '베이징': '🇨🇳',
      '한국': '🇰🇷', '제주': '🇰🇷', '부산': '🇰🇷', '서울': '🇰🇷',
      '독일': '🇩🇪', '스위스': '🇨🇭', '호주': '🇦🇺', '캐나다': '🇨🇦'
    };

    const getFlagFromText = (text) => {
      if (!text) return '✈️';
      for (const key in FLAG_MAP) {
        if (text.includes(key)) return FLAG_MAP[key];
      }
      return '✈️';
    };

    const isYenCurrency = (currencyStr = '', countryName = '') => {
      const target = (currencyStr + countryName).toUpperCase();
      return target.includes('JPY') || target.includes('엔') || target.includes('YEN');
    };

    function SwipeableCard({ children, onEdit, onDelete, onClickContent }) {
      const [translateX, setTranslateX] = useState(0);
      const startX = useRef(0);
      const currentX = useRef(0);
      const isDragging = useRef(false);

      const handleTouchStart = (e) => {
        startX.current = e.touches ? e.touches[0].clientX : e.clientX;
        isDragging.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isDragging.current) return;
        currentX.current = e.touches ? e.touches[0].clientX : e.clientX;
        const diff = currentX.current - startX.current;
        if (Math.abs(diff) < 120) {
          setTranslateX(diff);
        }
      };

      const handleTouchEnd = () => {
        if (!isDragging.current) return;
        isDragging.current = false;
        if (translateX > 70) {
          onDelete();
        } else if (translateX < -70) {
          onEdit();
        } else if (Math.abs(translateX) < 5 && onClickContent) {
          onClickContent();
        }
        setTranslateX(0);
      };

      return (
        <div 
          className="swipe-container rounded-2xl overflow-hidden select-none"
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
          onMouseDown={handleTouchStart}
          onMouseMove={handleTouchMove}
          onMouseUp={handleTouchEnd}
          onMouseLeave={handleTouchEnd}
        >
          <div className="absolute inset-0 flex justify-between items-center px-4 font-bold text-xs text-white">
            <div className="bg-red-500 h-full w-1/2 flex items-center justify-start pl-4">🗑️ 삭제</div>
            <div className="bg-indigo-600 h-full w-1/2 flex items-center justify-end pr-4">✏️ 수정</div>
          </div>

          <div 
            className="swipe-content bg-white p-3.5 relative z-10 border-b border-slate-100 last:border-none"
            style={{ transform: `translateX(${translateX}px)` }}
          >
            {children}
          </div>
        </div>
      );
    }

    function TravelApp() {
      const [user, setUser] = useState(null);
      const [fbReady, setFbReady] = useState(false);

      const [countries, setCountries] = useLocalStorage('travel_app_countries', []);
      const [selectedCountry, setSelectedCountry] = useState(null);
      const [activeTab, setActiveTab] = useState('home');

      const [showAddCountry, setShowAddCountry] = useState(false);
      const [editingCountryId, setEditingCountryId] = useState(null);
      const [newCountryInput, setNewCountryInput] = useState({ name: '', flag: '', currency: '', startDate: '', endDate: '', defaultRate: '' });

      const [useDoubleEx, setUseDoubleEx] = useLocalStorage('travel_app_use_double_ex', false);
      const [customBaseRate, setCustomBaseRate] = useState(900);
      const [krwUsd, setKrwUsd] = useLocalStorage('travel_app_krw_usd', 1350);
      const [usdLocal, setUsdLocal] = useLocalStorage('travel_app_usd_local', 150);

      const [expenses, setExpenses] = useLocalStorage('travel_app_expenses', []);
      const [activeExpenseSection, setActiveExpenseSection] = useState(null); // 지출 입력창이 활성화된 섹션 ('prep', 'day_1', 'day_2' 등)
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [newExpense, setNewExpense] = useState({ daySection: 'day_1', day: 1, title: '', amountLocal: '', customKrw: '', category: '식비', paymentMethod: '카드', cardName: '', receiptImage: '', isDoubleExchange: false });
      const [viewReceiptModal, setViewReceiptModal] = useState(null);
      const [uploadReceiptTargetId, setUploadReceiptTargetId] = useState(null);

      const [itinerary, setItinerary] = useLocalStorage('travel_app_itinerary', []);
      const [fullAddSpot, setFullAddSpot] = useState(null);
      const [viewSpotDetail, setViewSpotDetail] = useState(null);
      const [draggedSpotId, setDraggedSpotId] = useState(null);

      const [diaries, setDiaries] = useLocalStorage('travel_app_diaries', []);
      const [fullDiaryModal, setFullDiaryModal] = useState(null);
      const [fullEditDiary, setFullEditDiary] = useState(null);

      const [spots, setSpots] = useLocalStorage('travel_app_spots', []);
      const [spotCategoryFilter, setSpotCategoryFilter] = useState('ALL');
      const [spotSortOption, setSpotSortOption] = useState('ratingHigh');
      const [fullRatingPage, setFullRatingPage] = useState(null);
      const [rankShiftPopup, setRankShiftPopup] = useState(null);

      const [showStatsModal, setShowStatsModal] = useState(false);
      const [statsTab, setStatsTab] = useState('chart');

      const [flights, setFlights] = useLocalStorage('travel_app_flights', []);
      const [hotels, setHotels] = useLocalStorage('travel_app_hotels', []);
      const [showAirtelModal, setShowAirtelModal] = useState(false);
      const [showFlightModal, setShowFlightModal] = useState(false);
      const [newFlight, setNewFlight] = useState({ departureDate: '', flightNo: '', arrivalDate: '', paymentPlatform: '', note: '' });
      const [showHotelModal, setShowHotelModal] = useState(false);
      const [newHotel, setNewHotel] = useState({ name: '', checkInDate: '', checkInTime: '15:00', checkOutDate: '', checkOutTime: '11:00', address: '', paymentPlatform: '', bookingNo: '', note: '' });

      const [vouchers, setVouchers] = useLocalStorage('travel_app_vouchers', []);
      const [showVoucherListModal, setShowVoucherListModal] = useState(false);
      const [showVoucherModal, setShowVoucherModal] = useState(false);
      const [editingVoucherId, setEditingVoucherId] = useState(null);
      const [newVoucher, setNewVoucher] = useState({ title: '', fileName: '', fileData: '' });
      const [previewVoucher, setPreviewVoucher] = useState(null);

      const pressTimer = useRef(null);

      const [tips, setTips] = useLocalStorage('travel_app_tips', []);
      const [showTipListModal, setShowTipListModal] = useState(false);
      const [showTipModal, setShowTipModal] = useState(false);
      const [tipCategoryFilter, setTipCategoryFilter] = useState('전체');
      const [newTip, setNewTip] = useState({ title: '', category: '교통', content: '', link: '', image: '' });

      const [showWishModal, setShowWishModal] = useState(false);
      const [wishCategoryTab, setWishCategoryTab] = useState('place');

      useEffect(() => {
        const initFB = () => {
          if (window.FirebaseAPI) {
            setFbReady(true);
            const { auth, onAuthStateChanged } = window.FirebaseAPI;
            onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
            });
          }
        };

        if (window.FirebaseAPI) {
          initFB();
        } else {
          window.addEventListener('firebase-ready', initFB);
          return () => window.removeEventListener('firebase-ready', initFB);
        }
      }, []);

      useEffect(() => {
        if (!user || !window.FirebaseAPI) return;
        const { db, doc, onSnapshot } = window.FirebaseAPI;
        const userDocRef = doc(db, 'users', user.uid);

        const unsub = onSnapshot(userDocRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.countries) setCountries(data.countries);
            if (data.expenses) setExpenses(data.expenses);
            if (data.itinerary) setItinerary(data.itinerary);
            if (data.diaries) setDiaries(data.diaries);
            if (data.spots) setSpots(data.spots);
            if (data.flights) setFlights(data.flights);
            if (data.hotels) setHotels(data.hotels);
            if (data.vouchers) setVouchers(data.vouchers);
            if (data.tips) setTips(data.tips);
          }
        });

        return () => unsub();
      }, [user]);

      const syncToCloud = (updatedData) => {
        if (!user || !window.FirebaseAPI) return;
        const { db, doc, setDoc } = window.FirebaseAPI;
        const userDocRef = doc(db, 'users', user.uid);
        setDoc(userDocRef, updatedData, { merge: true }).catch(err => console.error("Cloud Save Error:", err));
      };

      const handleGoogleLogin = async () => {
        if (!window.FirebaseAPI) return;
        const { auth, provider, signInWithPopup } = window.FirebaseAPI;
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.error("Login Failed:", err);
          alert("구글 로그인에 실패하였습니다.");
        }
      };

      const handleGoogleLogout = async () => {
        if (!window.FirebaseAPI) return;
        const { auth, signOut } = window.FirebaseAPI;
        try {
          await signOut(auth);
          setUser(null);
        } catch (err) {
          console.error("Logout Failed:", err);
        }
      };

      const handleSelectCountry = (country) => {
        setSelectedCountry(country);
        setCustomBaseRate(country.defaultRate || (isYenCurrency(country.currency, country.name) ? 900 : 1350));
        setActiveTab('home');
      };

      const calculateTotalDays = (startStr, endStr) => {
        if (!startStr || !endStr) return 1;
        const start = new Date(startStr);
        const end = new Date(endStr);
        const diffDays = Math.ceil((end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1;
        return diffDays > 0 ? diffDays : 1;
      };

      const getDateForDay = (startDateStr, dayNum) => {
        if (!startDateStr || !dayNum || dayNum <= 0) return '';
        const d = new Date(startDateStr);
        d.setDate(d.getDate() + (dayNum - 1));
        return d.toISOString().slice(0, 10);
      };

      const calcKrw = (item) => {
        if (item.customKrw) return Number(item.customKrw);
        const isYen = isYenCurrency(selectedCountry?.currency, selectedCountry?.name);
        const rateFactor = isYen ? (customBaseRate / 100) : customBaseRate;

        if (useDoubleEx && item.isDoubleExchange) {
          if (!usdLocal || usdLocal === 0) return 0;
          return Math.round((Number(item.amountLocal || 0) / usdLocal) * krwUsd);
        }
        return Math.round(Number(item.amountLocal || 0) * (rateFactor || 0));
      };

      const calcPlannedKrw = (plannedLocal) => {
        if (!plannedLocal) return 0;
        const isYen = isYenCurrency(selectedCountry?.currency, selectedCountry?.name);
        const rateFactor = isYen ? (customBaseRate / 100) : customBaseRate;
        return Math.round(Number(plannedLocal) * rateFactor);
      };

      const getExpenseGroupSummary = (expenseList) => {
        let totalKrw = 0;
        let totalLocal = 0;
        let hasEstimatedRate = false;

        expenseList.forEach(item => {
          totalKrw += calcKrw(item);
          totalLocal += Number(item.amountLocal || 0);
          if (!item.customKrw) {
            hasEstimatedRate = true;
          }
        });

        return { totalKrw, totalLocal, hasEstimatedRate };
      };

      const getCategoryExpenseStats = () => {
        if (!selectedCountry) return { categoryTotals: [], grandTotal: 0, conicGradient: '' };
        const currentExpenses = expenses.filter(e => e.countryId === selectedCountry.id);

        const categoryMap = { '식비': 0, '교통': 0, '쇼핑': 0, '관광': 0, '기타': 0 };
        let grandTotal = 0;

        currentExpenses.forEach(exp => {
          const amount = calcKrw(exp);
          const cat = categoryMap[exp.category] !== undefined ? exp.category : '기타';
          categoryMap[cat] += amount;
          grandTotal += amount;
        });

        const colorMap = {
          '식비': '#ef4444',
          '교통': '#3b82f6',
          '쇼핑': '#f59e0b',
          '관광': '#10b981',
          '기타': '#8b5cf6'
        };

        const categoryTotals = Object.keys(categoryMap).map(cat => ({
          name: cat,
          amount: categoryMap[cat],
          color: colorMap[cat],
          percent: grandTotal > 0 ? Math.round((categoryMap[cat] / grandTotal) * 100) : 0
        })).filter(c => c.amount > 0).sort((a, b) => b.amount - a.amount);

        let currentAngle = 0;
        const gradientSegments = categoryTotals.map(c => {
          const start = currentAngle;
          const percentage = (c.amount / (grandTotal || 1)) * 100;
          currentAngle += percentage;
          return `${c.color} ${start}% ${currentAngle}%`;
        });

        const conicGradient = grandTotal > 0 
          ? `conic-gradient(${gradientSegments.join(', ')})`
          : `conic-gradient(#cbd5e1 0% 100%)`;

        return { categoryTotals, grandTotal, conicGradient };
      };

      const handleCleanZeroInput = (rawVal, setter) => {
        if (rawVal === '') {
          setter('');
          return;
        }
        const num = Number(rawVal);
        setter(isNaN(num) ? '' : num);
      };

      const handleOpenEditCountry = (e, country) => {
        e.stopPropagation();
        setEditingCountryId(country.id);
        setNewCountryInput({
          name: country.name,
          flag: country.flag,
          currency: country.currency,
          startDate: country.startDate,
          endDate: country.endDate,
          defaultRate: country.defaultRate
        });
        setShowAddCountry(true);
      };

      const handleCreateOrUpdateCountry = () => {
        if (!newCountryInput.name || !newCountryInput.startDate || !newCountryInput.endDate) {
          alert('여행지 이름과 시작/종료 날짜를 입력해 주세요!');
          return;
        }

        const detectedFlag = newCountryInput.flag && newCountryInput.flag.trim().length > 0
          ? newCountryInput.flag 
          : getFlagFromText(newCountryInput.name);

        const isYen = isYenCurrency(newCountryInput.currency, newCountryInput.name);
        const defaultRateVal = newCountryInput.defaultRate ? Number(newCountryInput.defaultRate) : (isYen ? 900 : 1350);

        let nextCountries = [];
        if (editingCountryId) {
          nextCountries = countries.map(c => c.id === editingCountryId ? {
            ...c,
            name: newCountryInput.name,
            flag: detectedFlag,
            currency: newCountryInput.currency || 'USD',
            startDate: newCountryInput.startDate,
            endDate: newCountryInput.endDate,
            defaultRate: defaultRateVal
          } : c);
          setCountries(nextCountries);
          if (selectedCountry?.id === editingCountryId) {
            setSelectedCountry(nextCountries.find(c => c.id === editingCountryId));
          }
          setEditingCountryId(null);
        } else {
          nextCountries = [...countries, { 
            ...newCountryInput, 
            id: Date.now().toString(),
            flag: detectedFlag,
            currency: newCountryInput.currency || 'USD',
            defaultRate: defaultRateVal
          }];
          setCountries(nextCountries);
        }

        syncToCloud({ countries: nextCountries });
        setShowAddCountry(false);
        setNewCountryInput({ name: '', flag: '', currency: '', startDate: '', endDate: '', defaultRate: '' });
      };

      const handleDeleteCountry = (e, countryId, countryName) => {
        e.stopPropagation();
        if (confirm(`'${countryName}' 여행 기록을 정말 삭제하시겠습니까?`)) {
          const nextCountries = countries.filter(c => c.id !== countryId);
          const nextExpenses = expenses.filter(ex => ex.countryId !== countryId);
          const nextItinerary = itinerary.filter(it => it.countryId !== countryId);
          const nextDiaries = diaries.filter(d => d.countryId !== countryId);
          const nextSpots = spots.filter(s => s.countryId !== countryId);

          setCountries(nextCountries);
          setExpenses(nextExpenses);
          setItinerary(nextItinerary);
          setDiaries(nextDiaries);
          setSpots(nextSpots);

          syncToCloud({
            countries: nextCountries,
            expenses: nextExpenses,
            itinerary: nextItinerary,
            diaries: nextDiaries,
            spots: nextSpots
          });

          if (selectedCountry?.id === countryId) setSelectedCountry(null);
        }
      };

      const handleAddDay = () => {
        if (!selectedCountry) return;
        const currentEnd = new Date(selectedCountry.endDate);
        currentEnd.setDate(currentEnd.getDate() + 1);
        const newEndDateStr = currentEnd.toISOString().slice(0, 10);
        const updated = { ...selectedCountry, endDate: newEndDateStr };
        const nextCountries = countries.map(c => c.id === selectedCountry.id ? updated : c);
        setCountries(nextCountries);
        setSelectedCountry(updated);
        syncToCloud({ countries: nextCountries });
      };

      const handleDeleteItinerarySpot = (spot) => {
        const hasRating = spots.some(s => s.countryId === selectedCountry.id && s.name === spot.name);
        let confirmMessage = `'${spot.name}' 장소를 동선에서 삭제하시겠습니까?`;
        if (hasRating) {
          confirmMessage = `'${spot.name}' 장소는 별점 평가가 작성되어 있습니다.\n별점 평가 내용도 함께 정말 삭제하시겠습니까?`;
        }

        if (confirm(confirmMessage)) {
          const nextItinerary = itinerary.filter(i => i.id !== spot.id);
          setItinerary(nextItinerary);
          let nextSpots = spots;
          if (hasRating) {
            nextSpots = spots.filter(s => !(s.countryId === selectedCountry.id && s.name === spot.name));
            setSpots(nextSpots);
          }
          syncToCloud({ itinerary: nextItinerary, spots: nextSpots });
          if (viewSpotDetail?.id === spot.id) setViewSpotDetail(null);
        }
      };

      const handleDropSpotToDay = (targetDay, targetSpotId = null) => {
        if (!draggedSpotId) return;
        const sourceSpot = itinerary.find(i => i.id === draggedSpotId);
        if (!sourceSpot) return;

        let updated = itinerary.map(item => item.id === draggedSpotId ? { ...item, day: targetDay } : item);

        if (targetSpotId && targetSpotId !== draggedSpotId) {
          const daySpots = updated.filter(i => i.countryId === selectedCountry.id && i.day === targetDay);
          const draggedIdx = daySpots.findIndex(i => i.id === draggedSpotId);
          const targetIdx = daySpots.findIndex(i => i.id === targetSpotId);

          if (draggedIdx !== -1 && targetIdx !== -1) {
            const reordered = [...daySpots];
            const [removed] = reordered.splice(draggedIdx, 1);
            reordered.splice(targetIdx, 0, removed);

            const otherSpots = updated.filter(i => !(i.countryId === selectedCountry.id && i.day === targetDay));
            updated = [...otherSpots, ...reordered];
          }
        }

        setItinerary(updated);
        syncToCloud({ itinerary: updated });
        setDraggedSpotId(null);
      };

      const executeSpotItineraryUpdate = (spotData, targetDay) => {
        const isItinerary = targetDay > 0;
        let existingItem = itinerary.find(i => i.countryId === selectedCountry.id && (i.id === spotData.id || i.name === spotData.name));
        let updatedItinerary = itinerary.filter(i => !(i.countryId === selectedCountry.id && (i.id === spotData.id || i.name === spotData.name)));

        updatedItinerary.push({
          ...(existingItem || {}),
          ...spotData,
          id: spotData.id || Date.now(),
          countryId: selectedCountry.id,
          day: targetDay,
          inItinerary: isItinerary,
          visited: isItinerary ? (existingItem?.visited || false) : false
        });

        setItinerary(updatedItinerary);
        syncToCloud({ itinerary: updatedItinerary });
        setFullAddSpot(null);
      };

      const handleToggleVisited = (spot) => {
        const nextVisited = !spot.visited;
        const nextItinerary = itinerary.map(item => item.id === spot.id ? { ...item, visited: nextVisited } : item);

        syncToCloud({ itinerary: nextItinerary });

      const handleFileUpload = (e, callback) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => callback(file.name, reader.result);
        reader.readAsDataURL(file);

      const openGoogleMaps = (addressName) => {
        if (!addressName) return;
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addressName)}`, '_blank');

      // 💡 특정 일차/준비 섹션에서 '+ 추가' 버튼을 눌렀을 때 실행되는 폼 오픈 함수
      const openAddExpenseForm = (sectionKey, dayNum = 0) => {
        setEditingExpenseId(null);
        setNewExpense({ 
          daySection: sectionKey, 
          day: dayNum, 
          title: '', 
          amountLocal: '', 
          customKrw: '', 
          category: sectionKey === 'prep' ? '기타' : '식비', 
          paymentMethod: '카드', 
          cardName: '', 
          receiptImage: '', 
          isDoubleExchange: false 
        });
        setActiveExpenseSection(sectionKey);
      };

      const handleAddExpenseSubmit = () => {
        if (!newExpense.title || (!newExpense.amountLocal && !newExpense.customKrw)) return;
        const targetDay = newExpense.daySection && newExpense.daySection.startsWith('day_') 
          ? Number(newExpense.daySection.replace('day_', '')) 
          : 0;

        let nextExpenses = [];
        if (editingExpenseId) {
          nextExpenses = expenses.map(e => e.id === editingExpenseId ? {
            ...e,
            daySection: newExpense.daySection || 'prep',
            day: targetDay,
            title: newExpense.title,
            amountLocal: Number(newExpense.amountLocal || 0),
            customKrw: newExpense.customKrw ? Number(newExpense.customKrw) : null,
            category: newExpense.category,
            paymentMethod: newExpense.paymentMethod || '현금',
            cardName: newExpense.cardName || '',
            receiptImage: newExpense.receiptImage || '',
            isDoubleExchange: useDoubleEx ? newExpense.isDoubleExchange : false
          } : e);
          setExpenses(nextExpenses);
          setEditingExpenseId(null);
        } else {
          nextExpenses = [...expenses, {
            id: Date.now(),
            countryId: selectedCountry.id,
            daySection: newExpense.daySection || 'prep',
            day: targetDay,
            title: newExpense.title,
            amountLocal: Number(newExpense.amountLocal || 0),
            customKrw: newExpense.customKrw ? Number(newExpense.customKrw) : null,
            category: newExpense.category,
            paymentMethod: newExpense.paymentMethod || '현금',
            cardName: newExpense.cardName || '',
            receiptImage: newExpense.receiptImage || '',
            isDoubleExchange: useDoubleEx ? newExpense.isDoubleExchange : false
          }];
          setExpenses(nextExpenses);
        }

        syncToCloud({ expenses: nextExpenses });
        setActiveExpenseSection(null);
      };

      const handleEditExpense = (exp) => {
        setEditingExpenseId(exp.id);
        setNewExpense({
          daySection: exp.daySection,
          day: exp.day,
          title: exp.title,
          amountLocal: exp.amountLocal || '',
          customKrw: exp.customKrw || '',
          category: exp.category,
          paymentMethod: exp.paymentMethod,
          cardName: exp.cardName || '',
          receiptImage: exp.receiptImage || '',
          isDoubleExchange: exp.isDoubleExchange || false
        });
        setActiveExpenseSection(exp.daySection || (exp.day === 0 ? 'prep' : `day_${exp.day}`));
      };

      const handleDeleteExpenseItem = (exp) => {
        if (confirm(`'${exp.title}' 지출 내역을 삭제하시겠습니까?`)) {
          const nextExpenses = expenses.filter(e => e.id !== exp.id);
          setExpenses(nextExpenses);
          syncToCloud({ expenses: nextExpenses });
        }
      };

      const handleDeleteReceipt = (expId) => {
        const nextExpenses = expenses.map(e => e.id === expId ? { ...e, receiptImage: '' } : e);
        setExpenses(nextExpenses);
        syncToCloud({ expenses: nextExpenses });
      };

      const handleDirectReceiptUpload = (expId, base64) => {
        const nextExpenses = expenses.map(e => e.id === expId ? { ...e, receiptImage: base64 } : e);
        setExpenses(nextExpenses);
        syncToCloud({ expenses: nextExpenses });
        setUploadReceiptTargetId(null);
      };

      const handleSaveVoucherSubmit = () => {
        if (!newVoucher.title) return;
        let nextVouchers = [];
        if (editingVoucherId) {
          nextVouchers = vouchers.map(v => v.id === editingVoucherId ? { ...v, ...newVoucher } : v);
          setVouchers(nextVouchers);
          setEditingVoucherId(null);
        } else {
          nextVouchers = [...vouchers, { ...newVoucher, id: Date.now(), countryId: selectedCountry.id }];
          setVouchers(nextVouchers);
        }
        syncToCloud({ vouchers: nextVouchers });
        setShowVoucherModal(false);
        setNewVoucher({ title: '', fileName: '', fileData: '' });
      };

      const handleDeleteVoucher = (voucherId, title) => {
        if (confirm(`'${title}' 서류를 삭제하시겠습니까?`)) {
          const nextVouchers = vouchers.filter(v => v.id !== voucherId);
          setVouchers(nextVouchers);
          syncToCloud({ vouchers: nextVouchers });
          if (previewVoucher?.id === voucherId) setPreviewVoucher(null);
        }
      };

      const handleVoucherTouchStart = (v) => {
        pressTimer.current = setTimeout(() => {
          handleDeleteVoucher(v.id, v.title);

      const handleVoucherTouchEnd = () => {
        if (pressTimer.current) clearTimeout(pressTimer.current);

      const handleOpenAddTipModal = () => {
        const initialCategory = (tipCategoryFilter && tipCategoryFilter !== '전체') ? tipCategoryFilter : '교통';
        setNewTip({ title: '', category: initialCategory, content: '', link: '', image: '' });
        setShowTipModal(true);
      };

      const handleSaveDiarySubmit = () => {
        if (!fullEditDiary || !fullEditDiary.title) {
          alert('일기 제목을 입력해 주세요!');
          return;
        }

        const existingSameDay = diaries.find(d => d.countryId === selectedCountry.id && d.day === fullEditDiary.day && d.id !== fullEditDiary.id);

        let nextDiaries = [];
        if (existingSameDay) {
          alert(`기존에 Day ${fullEditDiary.day} 일기가 있습니다.\n기존 Day ${fullEditDiary.day} 하단에 등록됩니다.`);
          
          const mergedBlocks = [...existingSameDay.blocks, ...fullEditDiary.blocks];
          nextDiaries = diaries.map(d => d.id === existingSameDay.id ? {
            ...d,
            title: d.title + ' / ' + fullEditDiary.title,
            blocks: mergedBlocks
          } : d);

          setDiaries(nextDiaries);
        } else {
          const existingIndex = diaries.findIndex(d => d.countryId === selectedCountry.id && d.id === fullEditDiary.id);
          if (existingIndex >= 0) {
            nextDiaries = [...diaries];

        setFullEditDiary({
          ...fullEditDiary,
          blocks: fullEditDiary.blocks.map(b => b.id === blockId ? { ...b, [field]: val } : b)
        });
      };

      const handleMoveDiaryBlock = (index, dir) => {
        const blocks = [...fullEditDiary.blocks];
        if ((dir === -1 && index === 0) || (dir === 1 && index === blocks.length - 1)) return;
        const temp = blocks[index];
        blocks[index] = blocks[index + dir];
        blocks[index + dir] = temp;
        setFullEditDiary({ ...fullEditDiary, blocks });
      };

      const handleDeleteDiaryBlock = (blockId) => {
        if (fullEditDiary.blocks.length <= 1) {

        } else {
          setFullRatingPage({ spotName: name, address: address || 'Google Maps 주소', category: defaultCat, rating: 5, rank: 0, review: '' });
        }
      };

      const handleSaveRatingProcess = (forceShift = false) => {
        const targetRank = fullRatingPage.rank;
        const targetCategory = fullRatingPage.category;

        if (targetRank > 0 && !forceShift) {
          const existingRankItem = spots.find(s => s.countryId === selectedCountry.id && s.category === targetCategory && s.rank === targetRank && s.name !== fullRatingPage.spotName);
          if (existingRankItem) {
            setRankShiftPopup({ existingItem: existingRankItem, newRank: targetRank });
            return;
          }
        }

        let updatedSpots = spots.filter(s => !(s.countryId === selectedCountry.id && s.name === fullRatingPage.spotName));
        if (targetRank > 0 && forceShift) {
          updatedSpots = updatedSpots.map(s => {
            if (s.countryId === selectedCountry.id && s.category === targetCategory && s.rank >= targetRank && s.rank < 3) {
              return { ...s, rank: s.rank + 1 };
            }
            return s;
          });
        }

        updatedSpots.push({
          id: fullRatingPage.id || Date.now(),
          countryId: selectedCountry.id,
          name: fullRatingPage.spotName,
          category: fullRatingPage.category,
          rating: fullRatingPage.rating,
          rank: targetRank,
          review: fullRatingPage.review,
          address: fullRatingPage.address
        });

        setSpots(updatedSpots);
        syncToCloud({ spots: updatedSpots });
        setFullRatingPage(null);
        setRankShiftPopup(null);
      };

      const getFilteredAndSortedSpots = () => {
        if (!selectedCountry) return [];
        const countrySpots = spots.filter(s => s.countryId === selectedCountry.id);
        
        let res = spotCategoryFilter === 'ALL' ? countrySpots : countrySpots.filter(s => s.category === spotCategoryFilter);
        
        return [...res].sort((a, b) => {
          if (spotSortOption === 'ratingHigh') return b.rating - a.rating;
          if (spotSortOption === 'ratingLow') return a.rating - b.rating;
          if (spotSortOption === 'topRank') return (b.rank || 0) - (a.rank || 0);
          return b.id - a.id;
        });
      };

      const getUnratedVisitedSpots = () => {
        if (!selectedCountry) return [];
        const visitedSpots = itinerary.filter(i => i.countryId === selectedCountry.id && i.visited);
        const ratedSpotNames = spots.filter(s => s.countryId === selectedCountry.id).map(s => s.name);
        return visitedSpots.filter(i => !ratedSpotNames.includes(i.name));

          case '쇼핑': return '🛍️';
          case '숙소': return '🏨';

        return Math.round((100 / usdLocal) * krwUsd);

      const availableItinerarySpotNames = selectedCountry 
        ? itinerary.filter(i => i.countryId === selectedCountry.id).map(i => i.name)
        : [];

      const filteredSpotAutoComplete = newExpense.title && newExpense.title.trim().length > 0
        ? availableItinerarySpotNames.filter(name => name.toLowerCase().includes(newExpense.title.toLowerCase()) && name !== newExpense.title)
        : [];

      const statsData = getCategoryExpenseStats();

      const renderExpenseFormInline = () => (
        <div className="bg-indigo-50/80 p-4 rounded-2xl shadow-inner space-y-3 text-xs border border-indigo-200 my-2">
          <div className="font-black text-xs text-indigo-900 border-b border-indigo-200 pb-2 flex justify-between items-center">
            <span>{editingExpenseId ? '✏️ 지출 내역 수정' : '💵 새 지출 입력'}</span>
            <button onClick={() => setActiveExpenseSection(null)} className="text-slate-400 font-bold">✕ 닫기</button>
          </div>
          
          <div className="relative">
            <input 
              type="text" 
              placeholder="지출 항목명 (예: 이치란 라멘)" 
              value={newExpense.title} 
              onChange={e => setNewExpense({...newExpense, title: e.target.value})} 
              className="w-full p-2.5 rounded-xl bg-white font-bold border-0 shadow-sm focus:ring-2 focus:ring-indigo-500" 
            />
            {filteredSpotAutoComplete.length > 0 && (
              <div className="absolute left-0 right-0 top-full mt-1 bg-white rounded-xl shadow-xl z-30 max-h-32 overflow-y-auto divide-y">
                {filteredSpotAutoComplete.map((spotName, idx) => (
                  <div 
                    key={idx} 
                    onClick={() => setNewExpense({...newExpense, title: spotName})}
                    className="p-2.5 text-xs font-bold text-indigo-700 hover:bg-indigo-50 cursor-pointer flex items-center justify-between"
                  >
                    <span>📍 {spotName}</span>
                    <span className="text-[10px] text-slate-400 font-normal">동선 연동</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex gap-2">
            <select value={newExpense.category} onChange={e => setNewExpense({...newExpense, category: e.target.value})} className="p-2.5 rounded-xl bg-white font-bold w-1/3 border-0 shadow-sm">
              <option value="식비">🍽️ 식비</option><option value="교통">🚊 교통</option><option value="쇼핑">🛍️ 쇼핑</option><option value="관광">🏛️ 관광</option><option value="기타">📌 기타</option>
            </select>
            <input type="number" placeholder={`금액 (${selectedCountry.currency})`} value={newExpense.amountLocal} onChange={e => handleCleanZeroInput(e.target.value, (val) => setNewExpense({...newExpense, amountLocal: val}))} className="p-2.5 rounded-xl bg-white w-2/3 border-0 font-bold shadow-sm" />
          </div>

          {useDoubleEx && (
            <label className="flex items-center gap-2 p-2 bg-white rounded-xl font-bold text-indigo-700 cursor-pointer border border-indigo-100">
              <input type="checkbox" checked={newExpense.isDoubleExchange} onChange={e => setNewExpense({...newExpense, isDoubleExchange: e.target.checked})} className="rounded text-indigo-600" />
              <span>💱 이중환전(USD 기반) 계산</span>
            </label>
          )}

          <input type="number" placeholder="💳 카드 결제 원화 금액 (생략시 환율 자동계산)" value={newExpense.customKrw} onChange={e => handleCleanZeroInput(e.target.value, (val) => setNewExpense({...newExpense, customKrw: val}))} className="w-full p-2.5 rounded-xl bg-white font-bold text-emerald-700 border-0 shadow-sm" />

          <div className="flex gap-2">
            <select value={newExpense.paymentMethod} onChange={e => setNewExpense({...newExpense, paymentMethod: e.target.value})} className="p-2.5 rounded-xl bg-white font-bold w-1/3 border-0 shadow-sm">
              <option value="카드">💳 카드</option><option value="현금">💵 현금</option><option value="페이">🟡 페이</option>

      return (

          {/* 1. 홈 여행 목록 */}
          {!selectedCountry ? (
            <div className="flex-1 p-5 flex flex-col bg-slate-50">
              <div className="bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-700 text-white p-6 rounded-3xl shadow-xl mb-6 relative overflow-hidden">
                <div className="relative z-10 flex justify-between items-center">
                  <div>
                    <span className="text-[11px] font-bold uppercase tracking-wider text-indigo-200 bg-white/10 px-2.5 py-1 rounded-full backdrop-blur-md">

                    <h1 className="text-2xl font-black mt-2 tracking-tight">나의 여행 기록 ✈️</h1>
                    <p className="text-xs text-indigo-100 mt-1">추억, 동선, 가계부를 한곳에서 만드세요</p>

                  <button

                      <button onClick={handleGoogleLogin} className="bg-white text-indigo-700 hover:bg-indigo-50 text-[10px] px-2.5 py-1 rounded-lg font-extrabold shadow shrink-0">Google 로그인</button>

                              🗑️

                          </div>
                        </div>

                          {block.image && <img src={block.image} className="w-full h-36 object-cover rounded-xl mt-2" />}
                        </div>
                        <textarea placeholder="추억 / 일기 내용 작성..." value={block.text} onChange={e => handleUpdateDiaryBlock(block.id, 'text', e.target.value)} className="w-full p-3 border rounded-xl text-xs h-24 bg-white" />
                      </div>
                    ))}
                  </div>

                  <button onClick={handleAddDiaryBlock} className="w-full py-3 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold border border-slate-200">+ 사진/텍스트 블록 추가</button>
                  <button onClick={handleSaveDiarySubmit} className="w-full py-3.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-md">일기 저장 완료</button>
                </div>
              )}

              {viewReceiptModal && (
                <div className="fixed inset-0 bg-black/80 z-50 flex flex-col justify-center items-center p-4">
                  <div className="bg-white rounded-3xl p-4 w-full max-w-sm space-y-3">
                    <div className="flex justify-between items-center border-b pb-2">
                      <span className="font-bold text-sm text-slate-800">🧾 영수증 이미지 관리</span>
                      <button onClick={() => setViewReceiptModal(null)} className="text-slate-400 font-bold">✕</button>
                    </div>
                    <img src={viewReceiptModal.receiptImage} className="w-full max-h-80 object-contain rounded-xl border bg-slate-50" />
                    
                    <div className="flex gap-2 pt-2">
                      <button 
                        onClick={() => {
                          handleDeleteReceipt(viewReceiptModal.id);
                          setViewReceiptModal(null);
                        }} 
                        className="flex-1 py-2.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-200"
                      >
                        🗑️ 영수증 삭제
                      </button>
                      <button 
                        onClick={() => {
                          setUploadReceiptTargetId(viewReceiptModal.id);
                          setViewReceiptModal(null);
                        }} 
                        className="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow"
                      >
                        ✏️ 영수증 변경
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {uploadReceiptTargetId && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl p-5 w-full max-w-xs space-y-3 text-center">
                    <h4 className="font-black text-slate-800 text-sm border-b pb-2">🧾 영수증 사진 즉시 첨부</h4>
                    <input type="file" accept="image/*" onChange={e => handleFileUpload(e, (name, base64) => handleDirectReceiptUpload(uploadReceiptTargetId, base64))} className="w-full text-xs p-1.5 border rounded-xl" />
                    <button onClick={() => setUploadReceiptTargetId(null)} className="w-full py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">취소</button>
                  </div>
                </div>
              )}

              {fullDiaryModal && (
                <div className="fixed inset-0 bg-white z-50 flex flex-col p-5 overflow-y-auto space-y-4">
                  <div className="flex justify-between items-center pb-3 border-b">
                    <div>
                      <h3 className="font-black text-lg text-slate-800">{fullDiaryModal.title}</h3>
                      <div className="text-xs text-indigo-600 font-bold">Day {fullDiaryModal.createdDate || getDateForDay(selectedCountry.startDate, fullDiaryModal.day)}</div>
                    </div>
                    <button onClick={() => setFullDiaryModal(null)} className="text-slate-400 font-bold">✕ 닫기</button>
                  </div>
                  <div className="space-y-6 flex-1">
                    {fullDiaryModal.blocks.map((block, idx) => (
                      <div key={idx} className="space-y-2">
                        {block.image && <img src={block.image} className="w-full rounded-2xl shadow-md" />}
                        {block.text && <p className="text-sm text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-2xl border">{block.text}</p>}
                      </div>
                    ))}
                  </div>
                  <button onClick={() => { setFullEditDiary(fullDiaryModal); setFullDiaryModal(null); }} className="w-full py-3 bg-indigo-600 text-white rounded-xl text-xs font-bold">✏️ 일기 수정하기</button>
                </div>
              )}

            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TravelApp />);
  </script>
</body>
</html>
